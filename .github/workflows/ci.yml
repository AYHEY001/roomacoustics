name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 工具链版本
        run: moon version --all

      # 全新环境注册表索引为空，缺这步会报
      # `Failed to resolve registry dependency ... module was not found in the registry`
      - name: 更新包索引
        run: moon update

      - name: 物理验证探针（交叉对账的基准）
        run: |
          python3 -m pip install --quiet numpy
          PYTHONIOENCODING=utf-8 python3 _probe/physics_probe.py

      # 断言核心库 moon.pkg 的依赖恰好等于白名单。
      # moon check 只保证"能编译"，不保证"依赖没变多"——
      # 往核心库里加 I/O 库照样能通过编译，约定会悄悄被破坏。
      - name: 分层守卫（核心库不得依赖 I/O 与频谱库）
        run: PYTHONIOENCODING=utf-8 python3 docs/check_layering.py

      - run: moon check --deny-warn
      - run: moon fmt --check
      - run: moon test --deny-warn

      # 断言文档里写的测试数与实际跑出来的一致。
      # 这个数字会随加测试而变，手工同步必然漂（已经漂过一次），
      # 漂了不报错，只会让"可核对"这句主张落空。
      - name: 文档数字守卫（测试数须与文档一致）
        run: PYTHONIOENCODING=utf-8 python3 docs/check_doc_numbers.py

      - name: CLI 冒烟测试
        run: |
          # 用仓库内已提交的语料（testdata/），不重新生成
          moon run cmd/main -- sabine --length 5 --width 4 --height 2.6 --alpha 0.2
          moon run cmd/main -- modes --count 5
          moon run cmd/main -- decay -f testdata/clean_0.8.json
          moon run cmd/main -- decay -f testdata/ir_mono_0.8.wav
          moon run cmd/main -- decay -f testdata/ir_stereo_0.8.wav
          moon run cmd/main -- modes --from-ir testdata/room_5x4x2.6_image_source.wav